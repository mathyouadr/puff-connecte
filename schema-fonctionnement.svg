<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 555" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a90"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #fafaf7; }
    .ink { fill: #1d1d1f; }
    .muted { fill: #5f5f66; }
    .step { fill: #ffffff; stroke: #2f6fd6; stroke-width: 2; }
    .last { fill: #ffffff; stroke: #d4a017; stroke-width: 2; }
    .arrow { fill: none; stroke: #8a8a90; stroke-width: 2.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #17181a; }
      .ink { fill: #f2f2f2; }
      .muted { fill: #a8a8ae; }
      .step { fill: #202124; stroke: #5b93f0; }
      .last { fill: #202124; stroke: #e8b830; }
    }
  </style>

  <rect class="bg" width="820" height="555"/>

  <text class="ink" x="40" y="45" font-size="22" font-weight="700">Puff connecté : fonctionnement</text>
  <text class="muted" x="40" y="70" font-size="14">D'une aspiration dans la puff jusqu'à l'action Home Assistant</text>

  <rect class="step" x="150" y="95" width="520" height="62" rx="8"/>
  <text class="ink" x="170" y="121" font-size="15" font-weight="700">1. On aspire dans la puff</text>
  <text class="muted" x="170" y="143" font-size="13">Le capteur détecte l'aspiration et active sa sortie OUT.</text>
  <line class="arrow" x1="410" y1="157" x2="410" y2="185" marker-end="url(#fleche)"/>

  <rect class="step" x="150" y="187" width="520" height="62" rx="8"/>
  <text class="ink" x="170" y="213" font-size="15" font-weight="700">2. OUT passe à la tension batterie</text>
  <text class="muted" x="170" y="235" font-size="13">GPIO4 passe à l'état haut. Au repos, le pulldown le tient à 0 V.</text>
  <line class="arrow" x1="410" y1="249" x2="410" y2="277" marker-end="url(#fleche)"/>

  <rect class="step" x="150" y="279" width="520" height="62" rx="8"/>
  <text class="ink" x="170" y="305" font-size="15" font-weight="700">3. L'ESP32 filtre le signal</text>
  <text class="muted" x="170" y="327" font-size="13">Anti-rebond de 50 ms, PWM du contrôleur lissé, puis on_press se déclenche.</text>
  <line class="arrow" x1="410" y1="341" x2="410" y2="369" marker-end="url(#fleche)"/>

  <rect class="step" x="150" y="371" width="520" height="62" rx="8"/>
  <text class="ink" x="170" y="397" font-size="15" font-weight="700">4. Wi-Fi → Home Assistant (API ESPHome chiffrée)</text>
  <text class="muted" x="170" y="419" font-size="13">Action choisie (light.toggle par défaut) sur l'entité choisie.</text>
  <line class="arrow" x1="410" y1="433" x2="410" y2="461" marker-end="url(#fleche)"/>

  <rect class="last" x="150" y="463" width="520" height="62" rx="8"/>
  <text class="ink" x="170" y="489" font-size="15" font-weight="700">5. La lampe s'allume ou s'éteint</text>
  <text class="muted" x="170" y="511" font-size="13">L'entrée « Aspiration » sert aussi pour vos propres automatisations.</text>
</svg>
